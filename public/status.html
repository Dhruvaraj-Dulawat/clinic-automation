<!DOCTYPE html>
<!-- clinic-automation status lookup page (public/status.html). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check status — Clinic Automation</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="/">Your Clinic Name</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/booking.html">Book appointment</a>
        <a href="/status.html" class="active" aria-current="page">Check status</a>
        <a href="/admin.html">Admin</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div id="flash"></div>
    <section class="card">
      <h1 class="card-title">Check my appointment</h1>
      <form id="status-form">
        <label>Phone (WhatsApp) <input name="phone" required placeholder="+919876543210" /></label>
        <label>Last 4 digits of the same number
          <input name="last4" required inputmode="numeric" maxlength="4" placeholder="3210" />
          <span class="field-hint">Privacy check so others can't look up your visits.</span>
        </label>
        <div class="btn-row"><button class="btn" type="submit">Look up</button></div>
      </form>
    </section>
    <section class="card mt" id="result-card" hidden>
      <h2 class="card-title" id="result-title"></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Slot</th><th>Service</th><th>Status</th></tr></thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer"><span>Need changes? Reply to any WhatsApp message from the clinic.</span></footer>
  <script src="/js/status.js"></script>
</body>
</html>
